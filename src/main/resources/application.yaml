server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
    include-binding-errors: never

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pirate_team
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cloud:
    openfeign:
      okhttp:
        enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: pirate-team-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.apache.kafka: WARN
    org.apache.kafka.clients.admin.KafkaAdminClient: ERROR
    org.springframework.kafka: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

jwt:
  secret: uClrcaKGIPFVMfZfoyJMI5ipcDgBAQXRbSmHzxFfLQi
  accessTokenExpirationTime: 86400000
  refreshTokenExpirationTime: 2592000000
